<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>ISBAT ERP — Login Flow (Direction A, Handoff)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;500;600;700&family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="styles/shared.css"/>
<style>
  html, body { height: 100%; margin: 0; background: #E8E4D9; }
  body { font-family: var(--font-sans); }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="components/design-canvas.jsx"></script>
<script type="text/babel" src="components/shared-bits.jsx"></script>
<script type="text/babel" src="components/direction-a.jsx"></script>

<script type="text/babel">
function Artboard({ screen }) {
  const [localScreen, setLocalScreen] = React.useState(screen);
  const [roleIdx, setRoleIdx] = React.useState(1);
  React.useEffect(() => { setLocalScreen(screen); }, [screen]);
  return <window.DirectionA screen={localScreen} setScreen={setLocalScreen} roleIdx={roleIdx} setRoleIdx={setRoleIdx} />;
}

const SCREENS = [
  { id: "landing", label: "01 · Portal chooser" },
  { id: "staff",   label: "02 · Staff sign-in" },
  { id: "student", label: "03 · Student sign-in" },
  { id: "otp",     label: "04 · Two-factor (OTP)" },
  { id: "forgot",  label: "05 · Forgot password" },
  { id: "setup",   label: "06 · First-time setup" },
  { id: "expired", label: "07 · Session expired" },
];

const { DesignCanvas, DCSection, DCArtboard } = window;

function App() {
  return (
    <DesignCanvas>
      <DCSection id="handoff" title="ISBAT ERP — Login Flow (Direction A)"
        subtitle="Handoff bundle. 7 screens, editorial split layout. See HANDOFF.md for endpoints, validation, routing and states.">
        {SCREENS.map(s => (
          <DCArtboard key={s.id} id={s.id} label={s.label} width={1200} height={780}>
            <Artboard screen={s.id} />
          </DCArtboard>
        ))}
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
